name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        shell: bash
        run: |
          # healthy skill must pass
          python skill_drift_doctor.py check tests/fixtures/healthy
          # drifted fixture intentionally fails refs; assert exit-code semantics
          python skill_drift_doctor.py refs tests/fixtures/drifted && exit 1 || test $? -eq 1
